<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIX SEVEN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-home">
        <h2> Academia do Six Seven</h2>
        <p id="mensagemBoasVindas"> Bem vindo!</p>
        <p> Treino Liberado. </p>
        <button id="'btn-secundário"> Ver treinos </button>
        <button id="btnSair"> Sair </button>
    </div>
    
    <script>
        const usuarioLogado = localStorage.getItem('usuarioLogado');

        if(!usuarioLogado) {
            window.location.href='index.html';
        } else { 
            document.getElementById('mensagemBoasVindas').textContent = 'Ben vindo, ' + usuarioLogado + '!';
        }
        document.getElementById('btnSair').addEventListener('click', function(){
            localStorage.removeItem('usuarioLogado');
            window.location.href='index.html'
        })
    </script>
</body>
</html>
